<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aladin&family=Archivo+Black&family=Black+Ops+One&family=Butcherman&family=Creepster&family=Nosifer&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="container">
         <div style="display: flex;justify-content: center;align-items: center;flex-direction: column;gap: 10rem;">
            <h1 style="text-align: center; font-size: 5rem;padding-top: 3rem;font-family: Creepster;color: orange;"><span style="color: white;">Ghosty</span> Bird</h1>
            <div style="display: flex;gap: 10rem;align-items: center;justify-content: center;">
          
<div style="display: flex;flex-direction: column">
    <img src="./Assets/ghost.png" alt="ghost" style="width: 15rem;justify-self: flex-start;">
    <div style="font-size: 2rem;background-color: orange;color: white;padding: 0.5rem;border-radius: 20px;" id="charDetails">I am Norbu and I don't like Pumpkins</div>
</div>
<svg id="svg" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     width="200" height="200">
  <circle cx="50" cy="50" r="46" fill="white"  id="circle"/>
  <path d="M40 29 L70 50 L40 71 Z" fill="black" id="play"/>
</svg>

            </div>
         </div>
    </div>
    <div id="retryContainer">
         
<div id="retrySvg" style="width: 10rem;border-radius: 50%;height: 10rem;display: flex;justify-content: center;align-items: center;">
    <svg id="retry" xmlns="http://www.w3.org/2000/svg"
     width="120" height="120"
     viewBox="0 0 30 30"
     fill="none"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M20 7v5h-5"/>
  <path d="M20 12a8 8 0 1 0 2 5"/>
</svg>

</div>
<div style="font-size: 3rem;background-color: white;padding: 0.4rem; border-radius: 20px;display: flex;gap: 0.5rem;font-family: Aladin;">Score : <div id="score">dfd</div></div>

    </div>
    <script src="./index.js"></script>
</body>
</html>
